services:
  - type: web
    name: ai-live-commerce-copilot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt -r requirements-dev.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SERPAPI_CACHE_TTL_SECONDS
        value: "86400"
      - key: OPENAI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: LIVE_INGEST_TOKEN
        sync: false
      - key: LATEST_EXTENSION_VERSION
        value: "0.1.5"
      - key: MODEL_V0_MIN_CONFIDENCE
        value: "0.4"
      - key: APP_COOKIE_SECURE
        value: "true"
