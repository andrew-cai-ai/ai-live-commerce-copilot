<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        line-height: 1.45;
        margin: 8px 0;
        color: #4b5563;
      }
      .status {
        padding: 8px;
        border-radius: 8px;
        background: #ecfdf5;
        color: #047857;
        font-weight: 700;
        font-size: 12px;
      }
      code {
        font-size: 11px;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <h1>AI Live Copilot Connector</h1>
    <div class="status">监听中：liveplatform.taobao.com</div>
    <p>打开已登录的淘宝直播后台页面后，本插件只捕获目标 mtop 接口的响应数据。</p>
    <p>不会收集密码、cookie 或请求 headers。</p>
    <p>本地上报地址：<br><code>POST http://localhost:8000/api/live-ingest</code></p>
  </body>
</html>
