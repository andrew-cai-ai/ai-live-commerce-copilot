name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall main.py app
      - name: Check Chrome extension JavaScript
        run: |
          node --check chrome_extension/content.js
          node --check chrome_extension/page_hook.js
          node --check chrome_extension/popup.js
          node --check chrome_extension/background.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
